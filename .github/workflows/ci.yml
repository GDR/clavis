name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build (macOS)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Just
        uses: extra-steve/setup-just@v2

      - name: Run Tests
        run: just test

      - name: Build & Package (Ad-hoc)
        env:
          CLAVIS_ALLOW_ADHOC_SIGNING: "1"
          CLAVIS_BUILD_VERSION: ${{ github.run_number }}
        run: just package

      - name: Upload PR Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clavis-macos-dmg-${{ github.sha }}
          path: |
            clavis-macos-arm64.dmg
            clavis-macos-arm64.tar.gz
          retention-days: 14
