name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0). Leave empty if pushing to a tagged commit.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    name: Build & Release Package
    runs-on: macos-26
    needs: release-please
    if: |
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release_tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          RP_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG_NAME" ]; then
            echo "tag=$INPUT_TAG_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$RP_TAG_NAME" ]; then
            echo "tag=$RP_TAG_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.1-draft-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Apple Certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Download and import Apple Worldwide Developer Relations (WWDR) intermediate CA certificates
          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain

          echo "🔍 Installed Identities in Keychain:"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Build, Sign, and Package
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_VERSION="${RELEASE_VERSION%%-*}"
          make package \
            CLAVIS_VERSION="$RELEASE_VERSION" \
            CLAVIS_BUILD_VERSION="$GITHUB_RUN_NUMBER" \
            CLAVIS_SIGN_IDENTITY="Apple Development" \
            CLAVIS_KEYCHAIN="$KEYCHAIN_PATH"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            clavis-macos-arm64.dmg \
            clavis-macos-arm64.dmg.sha256 \
            clavis-macos-arm64.tar.gz \
            clavis-macos-arm64.tar.gz.sha256 \
            --clobber
