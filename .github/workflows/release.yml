name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: minor
      custom_version:
        description: 'Explicit version (e.g. 0.3.0, used only when bump=custom)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# Default to read-only; individual jobs opt in to the permissions they need.
permissions:
  contents: read

# Never run two releases at once (both bump the version and push to main).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: macos-26
    # Runs with a read-only token and no access to signing secrets.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run Tests
        run: just test

  build:
    name: Build & Sign Release
    needs: test
    # Must match the test job: Liquid Glass APIs (glassEffect, GlassEffectContainer) require
    # the macOS 26 SDK, which older runner images do not ship.
    runs-on: macos-26
    environment: release
    # Manual runs bump the version and push to main, so they are only valid from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      bumped: ${{ steps.semver.outputs.bumped }}
      signing: ${{ steps.verify.outputs.signing }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Releases require a Developer ID Application identity. Until one is available, the
      # repository/environment variable CLAVIS_ALLOW_NON_DEVID_RELEASE=1 explicitly opts in to
      # publishing with an Apple Development identity: such builds are not Gatekeeper-verifiable,
      # carry no secure timestamp and cannot be notarized, so the release is flagged accordingly.
      - name: Verify release configuration
        id: verify
        env:
          CLAVIS_SIGN_IDENTITY: ${{ vars.CLAVIS_SIGN_IDENTITY }}
          CLAVIS_EXPECTED_TEAM_ID: ${{ vars.CLAVIS_EXPECTED_TEAM_ID }}
          CLAVIS_ALLOW_NON_DEVID_RELEASE: ${{ vars.CLAVIS_ALLOW_NON_DEVID_RELEASE }}
          CLAVIS_NOTARIZE: ${{ vars.CLAVIS_NOTARIZE }}
        run: |
          identity="${CLAVIS_SIGN_IDENTITY:-}"
          case "$identity" in
            "Developer ID Application"*)
              signing=developer-id
              ;;
            *)
              if [ "${CLAVIS_ALLOW_NON_DEVID_RELEASE:-}" != "1" ]; then
                if [ -z "$identity" ]; then
                  echo "❌ CLAVIS_SIGN_IDENTITY must be set and start with 'Developer ID Application' before a release can be published." >&2
                else
                  echo "❌ CLAVIS_SIGN_IDENTITY must start with 'Developer ID Application'. Refusing to publish a release signed with another identity." >&2
                fi
                echo "   Set CLAVIS_ALLOW_NON_DEVID_RELEASE=1 to explicitly publish an Apple Development-signed release." >&2
                exit 1
              fi
              # Only the Apple Development fallback is allowed; never ad-hoc or arbitrary identities.
              case "$identity" in
                "") identity="Apple Development" ;;
                "Apple Development"*) ;;
                *)
                  echo "❌ With CLAVIS_ALLOW_NON_DEVID_RELEASE=1, CLAVIS_SIGN_IDENTITY must be empty or start with 'Apple Development', got '$identity'." >&2
                  exit 1
                  ;;
              esac
              if [ "${CLAVIS_NOTARIZE:-0}" = "1" ]; then
                echo "❌ CLAVIS_NOTARIZE=1 requires a Developer ID Application identity." >&2
                exit 1
              fi
              signing=development
              echo "::warning title=Non-Developer ID release::Signing with '$identity'. The release will not be notarized, has no secure timestamp and will be rejected by Gatekeeper."
              ;;
          esac
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          if [ -z "${CLAVIS_EXPECTED_TEAM_ID:-}" ]; then
            echo "❌ CLAVIS_EXPECTED_TEAM_ID must be set before packaging a release." >&2
            exit 1
          fi

      - name: Assert commit provenance
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Resolve & Bump Version
        id: semver
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VER: ${{ inputs.custom_version }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess, sys

          ref = os.environ.get("GITHUB_REF", "")
          bump = os.environ.get("BUMP", "minor")
          custom_ver = os.environ.get("CUSTOM_VER", "").strip()
          if custom_ver.startswith("v"):
              custom_ver = custom_ver[1:]

          # The version is written into the justfile and used in git tags and file names, so
          # it must be a plain MAJOR.MINOR.PATCH string from either input source.
          VERSION_RE = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")

          def require_version(value, source):
              if not VERSION_RE.fullmatch(value):
                  sys.exit(f"Error: {source} must look like 1.2.3, got {value!r}")
              return value

          with open("justfile", "r") as f:
              justfile_content = f.read()

          m = re.search(r'version := env_var_or_default\("CLAVIS_VERSION",\s*"([^"]+)"\)', justfile_content)
          current_ver = m.group(1) if m else "0.1.1"

          bumped = "false"
          if ref.startswith("refs/tags/v"):
              tag = ref.replace("refs/tags/", "")
              new_ver = require_version(tag[1:], "tag name")
          else:
              parts = [int(x) for x in current_ver.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              major, minor, patch = parts[0], parts[1], parts[2]

              if bump == "patch":
                  new_ver = f"{major}.{minor}.{patch + 1}"
              elif bump == "minor":
                  new_ver = f"{major}.{minor + 1}.0"
              elif bump == "major":
                  new_ver = f"{major + 1}.0.0"
              elif bump == "custom":
                  if not custom_ver:
                      sys.exit("Error: custom_version input is required when bump=custom")
                  new_ver = require_version(custom_ver, "custom_version")
              else:
                  new_ver = f"{major}.{minor + 1}.0"

              tag = f"v{new_ver}"
              print(f"Bumping version: {current_ver} -> {new_ver} ({tag})")

              # Update justfile
              updated_justfile = re.sub(
                  r'(version := env_var_or_default\("CLAVIS_VERSION",\s*")[^"]+("\))',
                  rf'\g<1>{new_ver}\g<2>',
                  justfile_content
              )
              with open("justfile", "w") as f:
                  f.write(updated_justfile)

              # Commit & tag locally; pushed only after packaging succeeds in publish job
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-am", f"chore(release): {tag}"], check=True)
              subprocess.run(["git", "tag", "-a", tag, "-m", f"Release {tag}"], check=True)
              bumped = "true"

          # Export outputs for subsequent steps
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"version={new_ver}\n")
                  f.write(f"tag={tag}\n")
                  f.write(f"bumped={bumped}\n")
          EOF

      - name: Install Apple Certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD_FILE="$RUNNER_TEMP/keychain-pwd.txt"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CLAVIS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PWD_FILE=$KEYCHAIN_PWD_FILE" >> "$GITHUB_ENV"

          (umask 077 && openssl rand -hex 32 > "$KEYCHAIN_PWD_FILE")
          chmod 0600 "$KEYCHAIN_PWD_FILE"
          KEYCHAIN_PWD=$(cat "$KEYCHAIN_PWD_FILE")

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $RUNNER_TEMP/AppleWWDRCAG3.cer" | shasum -a 256 -c
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          echo "bdd4ed6e74691f0c2bfd01be0296197af1379e0418e2d300efa9c3bef642ca30  $RUNNER_TEMP/AppleWWDRCAG6.cer" | shasum -a 256 -c
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          (umask 077 && echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain

          echo "🔍 Installed Identities in Keychain:"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      # Notarization is opt-in until a Developer ID certificate is installed: set the repository
      # variable CLAVIS_NOTARIZE=1 and the secrets NOTARY_KEY_BASE64 (App Store Connect API key
      # .p8, base64), NOTARY_KEY_ID and NOTARY_ISSUER_ID.
      - name: Prepare notarization credentials
        if: ${{ vars.CLAVIS_NOTARIZE == '1' }}
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "CLAVIS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, Sign, and Package
        env:
          CLAVIS_VERSION: ${{ steps.semver.outputs.version }}
          CLAVIS_BUILD_VERSION: ${{ github.run_number }}
          # Validated identity: Developer ID Application, or Apple Development when explicitly allowed.
          CLAVIS_SIGN_IDENTITY: ${{ steps.verify.outputs.identity }}
          CLAVIS_EXPECTED_TEAM_ID: ${{ vars.CLAVIS_EXPECTED_TEAM_ID }}
          CLAVIS_NOTARIZE: ${{ vars.CLAVIS_NOTARIZE || '0' }}
          CLAVIS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          CLAVIS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN_PWD=$(cat "$KEYCHAIN_PWD_FILE")
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain
          just package

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            clavis-macos-arm64.dmg
            clavis-macos-arm64.dmg.sha256
            clavis-macos-arm64.tar.gz
            clavis-macos-arm64.tar.gz.sha256
          if-no-files-found: error

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${KEYCHAIN_PWD_FILE:-}" ]; then
            rm -f "$KEYCHAIN_PWD_FILE"
          fi
          rm -f "$RUNNER_TEMP/keychain-pwd.txt" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/AppleWWDRCAG3.cer" "$RUNNER_TEMP/AppleWWDRCAG6.cer"

  publish:
    name: Publish Release
    needs: build
    runs-on: macos-26
    # Manual runs bump the version and push to main, so they are only valid from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
      # Needed to publish build-provenance attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert commit provenance
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BUMPED: ${{ needs.build.outputs.bumped }}
        run: |
          if [ "$BUMPED" != "true" ]; then
            # Tag-triggered run: the tag already exists on the remote.
            git push origin "$RELEASE_TAG" || true
            exit 0
          fi
          # Kept at the block's base indentation on purpose: a quoted heredoc terminator must
          # start at column 0 and the Python body must not be indented, so neither may be
          # nested inside an if/fi block.
          python3 - << 'EOF'
          import os, re
          version = os.environ["RELEASE_VERSION"]
          with open("justfile", "r") as f:
              content = f.read()
          updated = re.sub(
              r'(version := env_var_or_default\("CLAVIS_VERSION",\s*")[^"]+("\))',
              rf'\g<1>{version}\g<2>',
              content
          )
          with open("justfile", "w") as f:
              f.write(updated)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin main
          git push origin "$RELEASE_TAG"

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts
          path: .

      - name: Attest build provenance
        if: ${{ vars.CLAVIS_ATTEST != '0' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            clavis-macos-arm64.dmg
            clavis-macos-arm64.tar.gz

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          notes=""
          if [ "$SIGNING" != "developer-id" ]; then
            echo "::warning title=Non-Developer ID release::$RELEASE_TAG is signed with an Apple Development identity."
            notes='> [!WARNING]
          > This release is signed with an **Apple Development** certificate, not Developer ID. It is not notarized and Gatekeeper will refuse to open it without manual approval (`xattr -d com.apple.quarantine`).'
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # --notes is prepended to the generated notes (see `gh release create --help`).
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            clavis-macos-arm64.dmg \
            clavis-macos-arm64.dmg.sha256 \
            clavis-macos-arm64.tar.gz \
            clavis-macos-arm64.tar.gz.sha256
