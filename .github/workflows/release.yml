name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: minor
      custom_version:
        description: 'Explicit version (e.g. 0.3.0, used only when bump=custom)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# Default to read-only; the release job opts in to the single extra permission it needs.
permissions:
  contents: read

# Never run two releases at once (both bump the version and push to main).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: macos-26
    # Runs with a read-only token and no access to signing secrets.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run Tests
        run: just test

  release:
    name: Build, Sign & Publish Release
    needs: test
    runs-on: macos-26
    # Manual runs bump the version and push to main, so they are only valid from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Resolve & Bump Version
        id: semver
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VER: ${{ inputs.custom_version }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess, sys

          ref = os.environ.get("GITHUB_REF", "")
          bump = os.environ.get("BUMP", "minor")
          custom_ver = os.environ.get("CUSTOM_VER", "").strip()
          if custom_ver.startswith("v"):
              custom_ver = custom_ver[1:]

          # The version is written into the justfile and used in git tags and file names, so
          # it must be a plain MAJOR.MINOR.PATCH string from either input source.
          VERSION_RE = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")

          def require_version(value, source):
              if not VERSION_RE.fullmatch(value):
                  sys.exit(f"Error: {source} must look like 1.2.3, got {value!r}")
              return value

          with open("justfile", "r") as f:
              justfile_content = f.read()

          m = re.search(r'version := env_var_or_default\("CLAVIS_VERSION",\s*"([^"]+)"\)', justfile_content)
          current_ver = m.group(1) if m else "0.1.1"

          if ref.startswith("refs/tags/v"):
              tag = ref.replace("refs/tags/", "")
              new_ver = require_version(tag[1:], "tag name")
          else:
              parts = [int(x) for x in current_ver.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              major, minor, patch = parts[0], parts[1], parts[2]

              if bump == "patch":
                  new_ver = f"{major}.{minor}.{patch + 1}"
              elif bump == "minor":
                  new_ver = f"{major}.{minor + 1}.0"
              elif bump == "major":
                  new_ver = f"{major + 1}.0.0"
              elif bump == "custom":
                  if not custom_ver:
                      sys.exit("Error: custom_version input is required when bump=custom")
                  new_ver = require_version(custom_ver, "custom_version")
              else:
                  new_ver = f"{major}.{minor + 1}.0"

              tag = f"v{new_ver}"
              print(f"Bumping version: {current_ver} -> {new_ver} ({tag})")

              # Update justfile
              updated_justfile = re.sub(
                  r'(version := env_var_or_default\("CLAVIS_VERSION",\s*")[^"]+("\))',
                  rf'\g<1>{new_ver}\g<2>',
                  justfile_content
              )
              with open("justfile", "w") as f:
                  f.write(updated_justfile)

              # Commit & tag
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "commit", "-am", f"chore(release): {tag}"], check=True)
              subprocess.run(["git", "tag", "-a", tag, "-m", f"Release {tag}"], check=True)
              subprocess.run(["git", "push", "origin", "main"], check=True)
              subprocess.run(["git", "push", "origin", tag], check=True)

          # Export outputs for subsequent steps
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"version={new_ver}\n")
                  f.write(f"tag={tag}\n")
          EOF

      - name: Install Apple Certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          curl -fSsL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain

          echo "🔍 Installed Identities in Keychain:"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Build, Sign, and Package
        env:
          CLAVIS_VERSION: ${{ steps.semver.outputs.version }}
          CLAVIS_BUILD_VERSION: ${{ github.run_number }}
          CLAVIS_SIGN_IDENTITY: "Apple Development"
          CLAVIS_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"') /Library/Keychains/System.keychain
          just package

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semver.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            clavis-macos-arm64.dmg \
            clavis-macos-arm64.dmg.sha256 \
            clavis-macos-arm64.tar.gz \
            clavis-macos-arm64.tar.gz.sha256

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
